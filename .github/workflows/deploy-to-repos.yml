name: Validate and Deploy to Separate Repositories

on:
  push:
    # branches-ignore:
      # - '1.0.0-ballot'  # Never run on pushes from this branch
  delete:  # Removes the preview a deleted branch left in the target repositories
  workflow_dispatch:  # Allow manual triggering

# Pushing again to the same branch cancels a run that is still going, rather
# than building both IGs twice in parallel. A delete event reports the default
# branch as github.ref, so it needs a group of its own: merging a pull request
# and deleting its branch would otherwise cancel the deploy of the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'delete' && format('delete-{0}', github.event.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  # Validation jobs run first
  validate-r4:
    runs-on: ubuntu-latest
    name: Validate R4 IG
    if: github.event_name != 'delete'
    env:
      JAVA_TOOL_OPTIONS: "-Xmx7g -Dfile.encoding=UTF-8"
    
    steps:
      - uses: actions/checkout@v5

      - name: Install Jekyll
        run: sudo gem install jekyll

      - name: Install Sushi
        run: sudo npm install -g fsh-sushi

      - name: Preprocess and validate R4 IG
        run: |
          chmod u+x *.sh
          ./_preProcessAndCheckAll.sh 4.0.1

  validate-r5:
    runs-on: ubuntu-latest
    name: Validate R5 IG
    if: github.event_name != 'delete'
    env:
      JAVA_TOOL_OPTIONS: "-Xmx7g -Dfile.encoding=UTF-8"
    
    steps:
      - uses: actions/checkout@v5

      - name: Install Jekyll
        run: sudo gem install jekyll

      - name: Install Sushi
        run: sudo npm install -g fsh-sushi

      - name: Preprocess and validate R5 IG
        run: |
          chmod u+x *.sh
          ./_preProcessAndCheckAll.sh 5.0.0

  # A smoke test for the PowerShell scripts, which the jobs above never touch:
  # without it they would drift away from their bash counterparts unnoticed. It
  # renders the liquid templates and compiles the result with SUSHI, which is
  # enough to catch a broken script, a botched copy or mangled encoding. The IG
  # publisher build is left to the jobs above, as it is slow and Windows runner
  # minutes are billed at a higher rate. Deployment deliberately does not depend
  # on this job: the PowerShell scripts have no influence on what is published.
  validate-powershell:
    runs-on: windows-latest
    name: Validate the PowerShell scripts
    if: github.event_name != 'delete'

    steps:
      - uses: actions/checkout@v7

      - name: Install Sushi
        run: npm install -g fsh-sushi

      # Downloading the packages takes minutes and says nothing about the
      # PowerShell scripts: of the SUSHI step, more than three minutes went into
      # fetching them and six seconds into the actual compile. The key follows
      # the dependency list, and an outdated cache is still worth restoring, as
      # only the packages that changed are fetched again.
      - name: Cache the FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-${{ hashFiles('ig-src/sushi-config.liquid.yaml') }}
          restore-keys: fhir-packages-${{ runner.os }}-

      - name: Preprocess the R4 IG with PowerShell
        # Windows PowerShell 5.1 rather than pwsh: it is the stricter of the two
        # and the one a Windows machine has without installing anything.
        shell: powershell
        run: ./_preprocessMultiVersion.ps1 4.0.1

      - name: Compile the generated FSH
        working-directory: igs/base-r4
        run: sushi .

  # Deployment jobs only run if validation passes
  deploy-r4:
    runs-on: ubuntu-latest
    needs: [validate-r4, validate-r5]  # Wait for both validations to pass
    # Dependabot branches are validated but not published as a preview
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/heads/dependabot/')
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch full history for proper branch handling
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}

      - name: Setup Git configuration
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Preprocess files
        run: |
          chmod u+x *.sh
          ./_preprocessMultiVersion.sh

      - name: Clone R4 target repository
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          R4_REPO_URL: ${{ vars.R4_REPO_URL || format('{0}/base', github.repository_owner) }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Error: DEPLOY_TOKEN secret not configured."
            echo "Add secret DEPLOY_TOKEN with write access to $R4_REPO_URL."
            exit 1
          fi
          git clone https://x-access-token:$DEPLOY_TOKEN@github.com/$R4_REPO_URL.git r4-repo

      - name: Prepare R4 repository branch
        working-directory: ./r4-repo
        run: |
          # Get current branch name
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Working with branch: $BRANCH_NAME"
          
          # Check if branch exists remotely
          if git ls-remote --heads origin $BRANCH_NAME | grep -q $BRANCH_NAME; then
            echo "Branch $BRANCH_NAME exists remotely, checking out"
            git checkout $BRANCH_NAME
          else
            echo "Branch $BRANCH_NAME doesn't exist, creating new branch"
            git checkout -b $BRANCH_NAME
          fi

      - name: Sync R4 content
        run: |
          # Remove all content from target repo except .git
          find ./r4-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy base-r4 content to root of target repository
          cp -r ./igs/base-r4/* ./r4-repo/

          # Ensure the hidden files of the top level are copied too, as the copy
          # above does not include them. Without -maxdepth 1 this collects hidden
          # files from the whole tree and flattens them into the repository root.
          find ./igs/base-r4 -maxdepth 1 -name ".*" -not -name ".git" -not -name "." -not -name ".." -exec cp -r {} ./r4-repo/ \; 2>/dev/null || true

      - name: Commit and push R4 changes
        working-directory: ./r4-repo
        run: |
          # Create a build trigger file to ensure there's always a commit for auto-ig-builder
          echo "Build triggered at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .build-trigger
          echo "Source commit: ${{ github.sha }}" >> .build-trigger
          echo "Source branch: ${{ github.ref_name }}" >> .build-trigger
          
          git add -A
          
          # Always commit to ensure auto-ig-builder triggers
          if git diff --staged --quiet; then
            echo "No content changes, but creating trigger commit for auto-ig-builder"
            git commit -m "Trigger auto-ig-builder - no content changes - source: ${{ github.sha }}"
          else
            git commit -m "Auto-sync from base-multi-versions repository - commit ${{ github.sha }}"
          fi
          
          git push origin ${{ github.ref_name }}
          echo "R4 repository updated successfully - auto-ig-builder should trigger"

  deploy-r5:
    runs-on: ubuntu-latest
    needs: [validate-r4, validate-r5]  # Wait for both validations to pass
    # Dependabot branches are validated but not published as a preview
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/heads/dependabot/')
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch full history for proper branch handling
          token: ${{ secrets.DEPLOY_TOKEN || github.token }}

      - name: Setup Git configuration
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Preprocess files
        run: |
          chmod u+x *.sh
          ./_preprocessMultiVersion.sh

      - name: Clone R5 target repository
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          R5_REPO_URL: ${{ vars.R5_REPO_URL || format('{0}/base-r5', github.repository_owner) }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Error: DEPLOY_TOKEN secret not configured."
            echo "Add secret DEPLOY_TOKEN with write access to $R5_REPO_URL."
            exit 1
          fi
          git clone https://x-access-token:$DEPLOY_TOKEN@github.com/$R5_REPO_URL.git r5-repo

      - name: Prepare R5 repository branch
        working-directory: ./r5-repo
        run: |
          # Get current branch name
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Working with branch: $BRANCH_NAME"
          
          # Check if branch exists remotely
          if git ls-remote --heads origin $BRANCH_NAME | grep -q $BRANCH_NAME; then
            echo "Branch $BRANCH_NAME exists remotely, checking out"
            git checkout $BRANCH_NAME
          else
            echo "Branch $BRANCH_NAME doesn't exist, creating new branch"
            git checkout -b $BRANCH_NAME
          fi

      - name: Sync R5 content
        run: |
          # Remove all content from target repo except .git
          find ./r5-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy base-r5 content to root of target repository
          cp -r ./igs/base-r5/* ./r5-repo/

          # Ensure the hidden files of the top level are copied too, as the copy
          # above does not include them. Without -maxdepth 1 this collects hidden
          # files from the whole tree and flattens them into the repository root.
          find ./igs/base-r5 -maxdepth 1 -name ".*" -not -name ".git" -not -name "." -not -name ".." -exec cp -r {} ./r5-repo/ \; 2>/dev/null || true

      - name: Commit and push R5 changes
        working-directory: ./r5-repo
        run: |
          # Create a build trigger file to ensure there's always a commit for auto-ig-builder
          echo "Build triggered at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .build-trigger
          echo "Source commit: ${{ github.sha }}" >> .build-trigger
          echo "Source branch: ${{ github.ref_name }}" >> .build-trigger
          
          git add -A
          
          # Always commit to ensure auto-ig-builder triggers
          if git diff --staged --quiet; then
            echo "No content changes, but creating trigger commit for auto-ig-builder"
            git commit -m "Trigger auto-ig-builder - no content changes - source: ${{ github.sha }}"
          else
            git commit -m "Auto-sync from base-multi-versions repository - commit ${{ github.sha }}"
          fi
          
          git push origin ${{ github.ref_name }}
          echo "R5 repository updated successfully - auto-ig-builder should trigger"

  # Deleting a branch here removes the preview it left in the target
  # repositories. This works because the delete event runs the workflow from the
  # default branch: the branch it reacts to is already gone.
  remove-previews:
    runs-on: ubuntu-latest
    name: Remove branch previews
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'

    steps:
      - name: Delete the branch in the target repositories
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          BRANCH: ${{ github.event.ref }}
          R4_REPO_URL: ${{ vars.R4_REPO_URL || format('{0}/base', github.repository_owner) }}
          R5_REPO_URL: ${{ vars.R5_REPO_URL || format('{0}/base-r5', github.repository_owner) }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Error: DEPLOY_TOKEN secret not configured."
            exit 1
          fi

          # The guides are published from these branches, they are never a preview
          case "$BRANCH" in
            master|main)
              echo "Refusing to delete $BRANCH in the target repositories"
              exit 0
              ;;
          esac

          for repo in "$R4_REPO_URL" "$R5_REPO_URL"; do
            if gh api "repos/$repo/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$repo/git/refs/heads/$BRANCH"
              echo "Deleted branch $BRANCH in $repo"
            else
              echo "No branch $BRANCH in $repo, nothing to do"
            fi
          done